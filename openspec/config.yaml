schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Tech stack: Python, FastAPI, PostgreSQL, RabbitMQ, Redis
  Frontend: React, TypeScript, Ant Design
  Domain: Intelligent Agent building platform with MCP integration
  
  Architecture:
  - Agent lifecycle management (creation, publishing, monitoring)
  - LLM context management (sliding window, summary algorithm)
  - MCP gateway for capability routing
  - RAG for retrieval-augmented generation
  - Multi-Agent collaboration
  - Long-term memory system
  
  Development practices:
  - Use type hints in Python code
  - Follow PEP 8 style guide
  - Write docstrings for all public functions and classes
  - Use Pydantic for data validation
  - Implement proper error handling
  - Write unit tests for critical business logic

# Per-artifact rules
rules:
  proposal:
    - Keep proposals under 1000 words
    - Always include a "Non-goals" section
    - Clearly define the problem being solved
    - Include success criteria
  design:
    - Include architecture diagrams using ASCII or mermaid
    - Document API contracts
    - Specify database schema changes
    - Consider security implications
  tasks:
    - Break tasks into chunks of max 2 hours each
    - Each task should be testable
    - Include verification steps
    - Order tasks by dependency
